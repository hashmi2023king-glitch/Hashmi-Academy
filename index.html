<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sir Haroon Javaid Hashmi Academy &amp; College</title>
  <style>
    :root {
      --bg-navy: #07142b;
      --bg-card: #0b1d3d;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.45);
      --green-btn: #164b2e;
      --green-hover: #1e663f;
      --white: #ffffff;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-navy);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 10px;
    }

    .app-frame {
      max-width: 540px;
      margin: 0 auto;
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(180deg, #081834 0%, #050f22 100%);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gold-soft);
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--white);
    }

    .live-clock {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-pill {
      background-color: var(--bg-card);
      color: var(--white);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-pill:hover,
    .nav-pill.active {
      background-color: var(--green-btn);
    }

    .hero-section {
      text-align: center;
      padding: 8px 4px 14px;
    }

    .academy-name {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .poet-line {
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .urdu-verse {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 10px;
      direction: rtl;
    }

    .emblem-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    .welcome-heading {
      color: var(--gold);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .director-role {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .sub-campus {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .action-btn {
      width: 100%;
      background-color: var(--green-btn);
      color: var(--white);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.96rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    .action-btn:hover {
      background-color: var(--green-hover);
    }

    .action-btn:active {
      transform: scale(0.99);
    }

    .panel-box {
      display: none;
      margin-top: 14px;
      background-color: var(--bg-card);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
    }

    .panel-box.open {
      display: block;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--gold-soft);
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
    }

    .close-btn {
      background: transparent;
      color: var(--white);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .panel-body {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--white);
    }

    .panel-list {
      margin-top: 8px;
      padding-left: 18px;
    }

    .panel-list li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <header class="top-bar">
      <div class="brand-title">🎓 Sir Haroon Global Academy</div>
      <div id="liveClock" class="live-clock">--:--:--</div>
      <nav class="top-actions" aria-label="Primary Navigation">
        <button type="button" class="nav-pill active" data-target="home">Home</button>
        <button type="button" class="nav-pill" data-target="portals">Portals</button>
        <button type="button" class="nav-pill" data-target="updates">Updates (<span id="updatesCount">0</span>)</button>
      </nav>
    </header>

    <section id="homeHero" class="hero-section">
      <h1 class="academy-name">Sir HAROON JAVAID HASHMI<br />Academy &amp; College</h1>
      <p class="poet-line">Allama Muhammad Iqbal - شاعر مشرق</p>
      <p class="urdu-verse">اپنی دنیا آپ پیدا کر اگر زندوں میں ہے تو</p>
      <div class="emblem-row" aria-hidden="true">
        <span>🦅</span>
        <span>🇵🇰</span>
      </div>
      <div class="welcome-heading">WELCOME</div>
      <div class="director-role">Director &amp; Founder - Sir Haroon Javaid Hashmi</div>
      <div class="sub-campus">Global Academy &amp; College</div>
    </section>

    <main class="menu-stack">
      <button type="button" class="action-btn" data-target="portals">Enter - Portals ➡️</button>
      <button type="button" class="action-btn" data-target="updates">Updates Gateway — OK / Yes vs. No 🔔</button>
      <button type="button" class="action-btn" data-target="library">Library - Data Bhara Hua - All Boards &amp; Systems</button>
      <button type="button" class="action-btn" data-target="reference">Reference Portals &amp; Study Apps</button>
      <button type="button" class="action-btn" data-target="register">Daily Register - Page 83-89</button>
      <button type="button" class="action-btn" data-target="global-diff">USA / UK / Europe - Farq - Subjects</button>
      <button type="button" class="action-btn" data-target="courses">Advertisement + Next Courses</button>
      <button type="button" class="action-btn" data-target="contact">Contact / WhatsApp / Location</button>
    </main>

    <section id="dynamicPanel" class="panel-box" aria-live="polite">
      <div class="panel-header">
        <h2 id="panelTitle" class="panel-title">Section</h2>
        <button type="button" id="closePanelBtn" class="close-btn">Close</button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </section>
  </div>

  <script>
    (function () {
      const clockEl = document.getElementById("liveClock");
      const updatesCountEl = document.getElementById("updatesCount");
      const panelEl = document.getElementById("dynamicPanel");
      const panelTitleEl = document.getElementById("panelTitle");
      const panelBodyEl = document.getElementById("panelBody");
      const closePanelBtn = document.getElementById("closePanelBtn");
      const navPills = document.querySelectorAll(".nav-pill");

      const sections = {
        portals: {
          title: "Academic Portals",
          html: `<p>Select a portal workspace:</p>
                 <ul class="panel-list">
                   <li><strong>Pakistani Students Portal</strong> — Nursery to Grade 12, Boards, CSS, PMS, Tehsildar, MDCAT, ECAT</li>
                   <li><strong>International Students Portal</strong> — Global Curriculum &amp; GBP (£) Fee Structure</li>
                   <li><strong>Teacher LMS Portal</strong> — Classes, Attendance, Lesson Plans &amp; Assessments</li>
                   <li><strong>Director Admin LMS</strong> — Admissions, Accounts, HR, Payroll &amp; Expansion Controls</li>
                 </ul>`
        },
        updates: {
          title: "Updates Gateway — OK / Yes vs. No",
          html: `<p>Active announcements and confirmation queue: <strong>0 pending items</strong>.</p>
                 <p style="margin-top:8px;">All system modules are initialized and ready for live data integration.</p>`
        },
        library: {
          title: "Library — All Boards & Systems",
          html: `<p>Digital books, reference guides, and open access academic resources (including DOAB &amp; curriculum shelves).</p>
                 <ul class="panel-list">
                   <li>School Boards (Nursery – Grade 12) &amp; Cambridge O/A Levels</li>
                   <li>Competitive Exams (CSS, PMS, Tehsildar, MDCAT, ECAT)</li>
                   <li>Languages (IELTS, Urdu, Spanish, German)</li>
                 </ul>`
        },
        reference: {
          title: "Reference Portals & Study Apps",
          html: `<p>Curated study portals, open repositories, and exam preparation tools.</p>
                 <ul class="panel-list">
                   <li>Directory of Open Access Books (DOAB) — Peer-reviewed academic books</li>
                   <li>Subject Dictionaries, Past Papers &amp; Revision Portals</li>
                 </ul>`
        },
        register: {
          title: "Daily Register — Page 83–89",
          html: `<p>Daily attendance, class log, and student/faculty register records (Pages 83–89).</p>`
        },
        "global-diff": {
          title: "USA / UK / Europe — Curriculum & Subjects Comparison",
          html: `<p>Key structural differences across major international education tracks:</p>
                 <ul class="panel-list">
                   <li><strong>UK:</strong> Key Stages, GCSE / IGCSE, A Levels, UCAS progression</li>
                   <li><strong>USA:</strong> Elementary, Middle &amp; High School credits, GPA, AP / SAT</li>
                   <li><strong>Europe:</strong> National qualifications, ECTS higher-ed credit system, multilingual tracks</li>
                 </ul>`
        },
        courses: {
          title: "Advertisement + Next Courses",
          html: `<p>Upcoming batches across academic levels, competitive exams, and language courses.</p>`
        },
        contact: {
          title: "Contact / WhatsApp / Location",
          html: `<p><strong>Director &amp; Founder:</strong> Sir Haroon Javaid Hashmi</p>
                 <p><strong>Institution:</strong> Sir Haroon Javaid Hashmi Academy &amp; College</p>
                 <p><strong>Launch Region:</strong> District Gujrat &amp; Global Online Campus</p>`
        }
      };

      function updateClock() {
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }

      function setActivePill(target) {
        navPills.forEach((pill) => {
          pill.classList.toggle("active", pill.dataset.target === target);
        });
      }

      function openSection(target) {
        if (!target || target === "home") {
          panelEl.classList.remove("open");
          setActivePill("home");
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        const sec = sections[target];
        if (!sec) return;
        panelTitleEl.textContent = sec.title;
        panelBodyEl.innerHTML = sec.html;
        panelEl.classList.add("open");
        setActivePill(target);
        panelEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      document.addEventListener("click", function (event) {
        const trigger = event.target.closest("[data-target]");
        if (trigger) {
          openSection(trigger.dataset.target);
        }
      });

      closePanelBtn.addEventListener("click", function () {
        panelEl.classList.remove("open");
        setActivePill("home");
      });

      updatesCountEl.textContent = "0";
      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
<script>
  (function () {
    const panelBodyEl = document.getElementById("panelBody");
    const panelTitleEl = document.getElementById("panelTitle");
    const panelEl = document.getElementById("dynamicPanel");
    if (!panelBodyEl || !panelTitleEl || !panelEl) return;

    const libraryCatalog = [
      { title: "Directory of Open Access Books (DOAB) — Peer-Reviewed Monographs", track: "Open Access / Research", level: "Higher Ed & Reference" },
      { title: "Foundational English, Urdu & Mathematics (Nursery – Grade 5)", track: "School Boards & Cambridge", level: "Primary" },
      { title: "Secondary Sciences, Pakistan Studies & Islamiat (Grades 6 – 10)", track: "School Boards & O Levels", level: "Secondary" },
      { title: "Intermediate & A Level Core Sciences, Humanities & Commerce", track: "FSc / ICS / FA / A Levels", level: "Higher Secondary" },
      { title: "CSS, PMS & Tehsildar — Syllabus & Current Affairs Compendium", track: "Competitive Exams", level: "Civil Services" },
      { title: "MDCAT & ECAT — Concept Drills & Past Paper Banks", track: "Entry Tests", level: "Pre-Medical / Engineering" },
      { title: "IELTS Academic & General + Urdu, Spanish & German Guides", track: "Languages", level: "All Levels" }
    ];

    const registerPages = {
      "83": [
        { roll: "01", name: "Ayesha Tariq", status: "Present" },
        { roll: "02", name: "Bilal Mahmood", status: "Present" },
        { roll: "03", name: "Hamza Siddiqui", status: "Absent" }
      ],
      "84": [
        { roll: "04", name: "Zainab Farooq", status: "Present" },
        { roll: "05", name: "Usman Ghani", status: "Present" },
        { roll: "06", name: "Maryam Khalid", status: "Leave" }
      ],
      "85": [
        { roll: "07", name: "Ali Raza", status: "Present" },
        { roll: "08", name: "Hira Naveed", status: "Present" }
      ],
      "86": [
        { roll: "09", name: "Saad Ahmed", status: "Absent" },
        { roll: "10", name: "Fatima Noor", status: "Present" }
      ],
      "87": [
        { roll: "11", name: "Daniyal Mirza", status: "Present" },
        { roll: "12", name: "Sanaullah Khan", status: "Present" }
      ],
      "88": [
        { roll: "13", name: "Mahnoor Aslam", status: "Present" },
        { roll: "14", name: "Taha Javed", status: "Absent" }
      ],
      "89": [
        { roll: "15", name: "Khadija Shah", status: "Present" },
        { roll: "16", name: "Zohaib Malik", status: "Present" }
      ]
    };

    function renderPortalsView() {
      panelTitleEl.textContent = "Academic Portals";
      panelBodyEl.innerHTML = `
        <div style="display:grid;gap:8px;">
          <button type="button" class="action-btn portal-sub-btn" data-portal="pk">🇵🇰 Pakistani Students Portal (Nursery–Grade 12, Boards, CSS/PMS, MDCAT/ECAT)</button>
          <button type="button" class="action-btn portal-sub-btn" data-portal="intl">🌍 International Students Portal (GBP £ Fee & Global Tracks)</button>
          <button type="button" class="action-btn portal-sub-btn" data-portal="teacher">👨‍🏫 Teacher LMS Portal (Classes, Attendance & Syllabus)</button>
          <button type="button" class="action-btn portal-sub-btn" data-portal="admin">🛡️ Director Admin LMS (Accounts, HR, Payroll & Expansion)</button>
        </div>
        <div id="portalDetailBox" style="margin-top:12px;padding:10px;border:1px solid rgba(212,175,55,0.45);border-radius:10px;background:#07142b;">
          Select any portal above to inspect its active modules.
        </div>
      `;

      const details = {
        pk: "<strong>Pakistani Students Portal:</strong> Covers Nursery to Grade 12 across Pakistani boards, CSS, PMS, Tehsildar, MDCAT, ECAT, and language tracks (IELTS, Urdu, Spanish, German).",
        intl: "<strong>International Students Portal:</strong> Segregated global student track structured with Pound Sterling (£) fee display and international curriculum schedules.",
        teacher: "<strong>Teacher LMS Portal:</strong> Manages daily class schedules, student attendance marking, lesson plans, and syllabus tracking.",
        admin: "<strong>Director Admin LMS:</strong> Central control for admissions, fee verification, payroll, HR, faculty hiring, and District Gujrat to global phase toggles."
      };

      panelBodyEl.querySelectorAll(".portal-sub-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const box = document.getElementById("portalDetailBox");
          if (box) box.innerHTML = details[btn.dataset.portal] || "";
        });
      });
    }

    function renderLibraryView() {
      panelTitleEl.textContent = "Library — All Boards & Systems";
      panelBodyEl.innerHTML = `
        <input id="libSearchInput" type="text" placeholder="Filter books or subjects..." style="width:100%;padding:9px 11px;border-radius:8px;border:1px solid #d4af37;background:#07142b;color:#fff;margin-bottom:10px;" />
        <ul id="libResultList" class="panel-list"></ul>
      `;

      const input = document.getElementById("libSearchInput");
      const list = document.getElementById("libResultList");

      function drawList(query) {
        const q = (query || "").trim().toLowerCase();
        const matches = libraryCatalog.filter(
          (item) =>
            item.title.toLowerCase().includes(q) ||
            item.track.toLowerCase().includes(q) ||
            item.level.toLowerCase().includes(q)
        );
        list.innerHTML = matches.length
          ? matches.map((m) => `<li><strong>${m.title}</strong> — <em>${m.track}</em> (${m.level})</li>`).join("")
          : "<li>No matching books found.</li>";
      }

      drawList("");
      input.addEventListener("input", (e) => drawList(e.target.value));
    }

    function renderRegisterView() {
      panelTitleEl.textContent = "Daily Register — Pages 83–89";
      const pageKeys = Object.keys(registerPages);
      panelBodyEl.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          ${pageKeys
            .map(
              (p, idx) =>
                `<button type="button" class="nav-pill reg-page-btn ${idx === 0 ? "active" : ""}" data-page="${p}">Page ${p}</button>`
            )
            .join("")}
        </div>
        <div id="registerTableWrap"></div>
      `;

      const wrap = document.getElementById("registerTableWrap");
      const statuses = ["Present", "Absent", "Leave"];

      function drawPage(pageNum) {
        const rows = registerPages[pageNum] || [];
        wrap.innerHTML = `
          <table style="width:100%;border-collapse:collapse;font-size:0.86rem;">
            <thead>
              <tr style="border-bottom:1px solid #d4af37;text-align:left;">
                <th style="padding:6px;">Roll</th>
                <th style="padding:6px;">Name</th>
                <th style="padding:6px;">Status (Tap to Cycle)</th>
              </tr>
            </thead>
            <tbody>
              ${rows
                .map(
                  (r, i) => `
                <tr style="border-bottom:1px solid rgba(212,175,55,0.25);">
                  <td style="padding:6px;">${r.roll}</td>
                  <td style="padding:6px;">${r.name}</td>
                  <td style="padding:6px;">
                    <button type="button" class="close-btn reg-status-btn" data-idx="${i}">${r.status}</button>
                  </td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
        `;

        wrap.querySelectorAll(".reg-status-btn").forEach((sBtn) => {
          sBtn.addEventListener("click", () => {
            const idx = Number(sBtn.dataset.idx);
            const current = rows[idx].status;
            const next = statuses[(statuses.indexOf(current) + 1) % statuses.length];
            rows[idx].status = next;
            sBtn.textContent = next;
          });
        });
      }

      drawPage("83");
      panelBodyEl.querySelectorAll(".reg-page-btn").forEach((pBtn) => {
        pBtn.addEventListener("click", () => {
          panelBodyEl.querySelectorAll(".reg-page-btn").forEach((b) => b.classList.remove("active"));
          pBtn.classList.add("active");
          drawPage(pBtn.dataset.page);
        });
      });
    }

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-target]");
      if (!trigger) return;
      const target = trigger.dataset.target;
      setTimeout(() => {
        if (!panelEl.classList.contains("open")) return;
        if (target === "portals") renderPortalsView();
        else if (target === "library") renderLibraryView();
        else if (target === "register") renderRegisterView();
      }, 0);
    });
  })();
</script>
<script>
  (function () {
    const panelBodyEl = document.getElementById("panelBody");
    const panelTitleEl = document.getElementById("panelTitle");
    const panelEl = document.getElementById("dynamicPanel");
    const updatesCountEl = document.getElementById("updatesCount");
    if (!panelBodyEl || !panelTitleEl || !panelEl) return;

    const updateQueue = [
      { id: "u1", text: "Enable Phase 1 Admissions — District Gujrat (Gujrat, Dinga, Kharian, Lalamusa, Sarai Alamgir, Jalalpur Jattan, Gulyana, Daulat Nagar)", status: "Pending" },
      { id: "u2", text: "Sync DOAB Open Access Book Directory & Curriculum Reference Shelves", status: "Pending" },
      { id: "u3", text: "Activate International GBP (£) Fee Portal & Remittance Verification Desk", status: "Pending" }
    ];

    function syncUpdatesBadge() {
      if (!updatesCountEl) return;
      const pending = updateQueue.filter((item) => item.status === "Pending").length;
      updatesCountEl.textContent = String(pending);
    }

    function renderUpdatesGateway() {
      panelTitleEl.textContent = "Updates Gateway — OK / Yes vs. No";
      panelBodyEl.innerHTML = `
        <p style="margin-bottom:10px;">Approve (<strong>OK / Yes</strong>) or hold (<strong>No</strong>) pending institutional updates:</p>
        <div id="updatesListWrap" style="display:grid;gap:10px;"></div>
      `;

      const wrap = document.getElementById("updatesListWrap");

      function drawQueue() {
        wrap.innerHTML = updateQueue
          .map(
            (item, idx) => `
          <div style="padding:10px;border:1px solid rgba(212,175,55,0.45);border-radius:10px;background:#07142b;">
            <div style="margin-bottom:8px;">${item.text}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <span style="font-size:0.8rem;color:#d4af37;">Status: <strong>${item.status}</strong></span>
              <div style="display:flex;gap:6px;">
                <button type="button" class="nav-pill upd-act-btn" data-idx="${idx}" data-val="OK / Yes">OK / Yes</button>
                <button type="button" class="close-btn upd-act-btn" data-idx="${idx}" data-val="No">No</button>
              </div>
            </div>
          </div>`
          )
          .join("");

        wrap.querySelectorAll(".upd-act-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.idx);
            updateQueue[idx].status = btn.dataset.val;
            syncUpdatesBadge();
            drawQueue();
          });
        });
      }

      drawQueue();
    }

    function renderReferencePortals() {
      panelTitleEl.textContent = "Reference Portals & Study Apps";
      panelBodyEl.innerHTML = `
        <div style="display:grid;gap:8px;">
          <a href="https://doabooks.org/" target="_blank" rel="noopener noreferrer" class="action-btn" style="text-decoration:none;display:block;">
            📚 DOAB — Directory of Open Access Books (111,000+ Peer-Reviewed Books)
          </a>
          <div style="padding:10px;border:1px solid rgba(212,175,55,0.45);border-radius:10px;background:#07142b;">
            <strong>Subject &amp; Exam Study Tools:</strong>
            <ul class="panel-list">
              <li>Matric, Intermediate &amp; Cambridge O/A Level Past Paper Archive</li>
              <li>CSS, PMS &amp; Tehsildar General Knowledge &amp; Current Affairs Digest</li>
              <li>MDCAT &amp; ECAT Concept Bank + Timed Practice Quizzes</li>
              <li>IELTS, Urdu, Spanish &amp; German Vocabulary &amp; Pronunciation Lab</li>
            </ul>
          </div>
        </div>
      `;
    }

    function renderGlobalComparison() {
      panelTitleEl.textContent = "USA / UK / Europe — Curriculum & Subjects Comparison";
      const tracks = {
        UK: "<strong>United Kingdom (UK):</strong> Key Stages 1–4, GCSE / IGCSE (Grades 9–10), A Levels (Grades 11–12), specialized subject depth (3–4 A Level subjects), UCAS university admission.",
        USA: "<strong>United States (USA):</strong> Elementary, Middle &amp; High School (Grades 9–12), broad credit-based curriculum, GPA tracking, Honors / AP courses, SAT / ACT readiness.",
        Europe: "<strong>Europe (Bologna / European Track):</strong> National secondary diplomas, International Baccalaureate (IB) options, multilingual instruction, ECTS higher-education credit transfer."
      };

      panelBodyEl.innerHTML = `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="nav-pill region-btn active" data-region="UK">UK System</button>
          <button type="button" class="nav-pill region-btn" data-region="USA">USA System</button>
          <button type="button" class="nav-pill region-btn" data-region="Europe">Europe System</button>
        </div>
        <div id="regionDetailBox" style="padding:10px;border:1px solid rgba(212,175,55,0.45);border-radius:10px;background:#07142b;">
          ${tracks.UK}
        </div>
      `;

      const box = document.getElementById("regionDetailBox");
      panelBodyEl.querySelectorAll(".region-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          panelBodyEl.querySelectorAll(".region-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          box.innerHTML = tracks[btn.dataset.region] || "";
        });
      });
    }

    function renderCoursesAndAds() {
      panelTitleEl.textContent = "Advertisement + Next Courses";
      panelBodyEl.innerHTML = `
        <div style="padding:10px;border:1px solid #d4af37;border-radius:10px;background:#07142b;margin-bottom:10px;">
          <strong style="color:#d4af37;">Admissions Open — Online &amp; Campus Batches</strong>
          <ul class="panel-list">
            <li>School &amp; College: Nursery to Grade 12 (Pakistani Boards &amp; Cambridge O/A Levels)</li>
            <li>Competitive Exams: CSS, PMS, Tehsildar, MDCAT &amp; ECAT Evening Sessions</li>
            <li>Global Languages: IELTS, Urdu, Spanish &amp; German Live Classes</li>
          </ul>
        </div>
        <button type="button" id="enrollAlertBtn" class="action-btn">Register Course Interest</button>
        <div id="enrollStatusMsg" style="margin-top:8px;font-size:0.85rem;color:#d4af37;"></div>
      `;

      const enrollBtn = document.getElementById("enrollAlertBtn");
      const statusMsg = document.getElementById("enrollStatusMsg");
      enrollBtn.addEventListener("click", () => {
        statusMsg.textContent = "Course inquiry logged. Open Contact / WhatsApp / Location to confirm seat & fee plan.";
      });
    }

    function renderContactSection() {
      panelTitleEl.textContent = "Contact / WhatsApp / Location";
      panelBodyEl.innerHTML = `
        <div style="padding:10px;border:1px solid rgba(212,175,55,0.45);border-radius:10px;background:#07142b;display:grid;gap:6px;">
          <div><strong>Director &amp; Founder:</strong> Sir Haroon Javaid Hashmi</div>
          <div><strong>Institution:</strong> Sir Haroon Javaid Hashmi Academy &amp; College</div>
          <div><strong>Phase 1 Hubs:</strong> Gujrat, Dinga, Sarai Alamgir, Lalamusa, Kharian, Jalalpur Jattan, Gulyana, Daulat Nagar</div>
          <div><strong>Global Desk:</strong> Online International Campus (UK / USA / Europe / Worldwide)</div>
        </div>
      `;
    }

    syncUpdatesBadge();

    document.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-target]");
      if (!trigger) return;
      const target = trigger.dataset.target;
      setTimeout(() => {
        if (!panelEl.classList.contains("open")) return;
        if (target === "updates") renderUpdatesGateway();
        else if (target === "reference") renderReferencePortals();
        else if (target === "global-diff") renderGlobalComparison();
        else if (target === "courses") renderCoursesAndAds();
        else if (target === "contact") renderContactSection();
      }, 0);
    });
  })();
</script>
