<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sir Haroon Javaid Hashmi Global Academy &amp; College</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--card:#fff;--line:#d5dcea;--fill:#C9A227;--gold:#8A6D0B;--gold2:#0A1931;--navy:#0A1931;--tx:#14213d;--mut:#5b6785;--ok:#1b7f46;--bad:#b4372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.6;display:flex;justify-content:center}
#app{width:100%;max-width:460px;min-height:100vh;padding:14px 14px 90px}
h1,h2{color:var(--navy);font-weight:700;margin:6px 0 12px;text-align:center}h1{font-size:28px}h2{font-size:22px}
h3{font-size:15px;margin:18px 0 8px;color:var(--gold)}
.hd{display:flex;align-items:center;gap:10px;background:var(--navy);border-bottom:3px solid var(--fill);padding:10px 12px;margin:-14px -14px 12px;border-radius:0 0 14px 14px}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--fill);color:var(--fill);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.nm{flex:1;color:#fff;font-weight:700;font-size:clamp(8px,2.6vw,12px);white-space:nowrap;text-align:right;overflow:hidden}
.out{background:none;border:1px solid var(--fill);color:var(--fill);border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer;flex:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.back{background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;box-shadow:0 2px 8px rgba(10,25,49,.07)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;color:var(--tx);font:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(10,25,49,.07)}
.tile b{display:block;color:var(--navy);margin:4px 0}.tile small{color:var(--mut)}
.ico{font-size:26px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--fill);color:#111;font:inherit;font-weight:700;font-size:16px;margin:8px 0;cursor:pointer}
.btn.o{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--fill);color:#111;font-weight:600;border-color:var(--fill)}
.chip.lock{opacity:.85;border-style:dashed}
label{display:block;color:var(--navy);font-weight:600;font-size:13px;margin:12px 0 6px}
select,input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);font:inherit}
.mut{color:var(--mut);font-size:13px}.big{font-size:26px;font-weight:700;color:var(--navy)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tg{width:48px;height:26px;border-radius:14px;background:#c5cde0;border:0;position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--fill)}.tg.on::after{left:25px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:var(--navy);border-top:3px solid var(--fill);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;color:#b8c2d9;padding:9px 0;font:inherit;font-size:11px;cursor:pointer}
.nav button.on{color:#E2C25A}.nav span{display:block;font-size:19px}
.news{background:#FFF7DC;border:1px solid var(--fill);color:var(--navy);border-radius:12px;padding:10px;font-size:13px;margin:6px 0}
.bar{height:7px;border-radius:4px;background:#e3e8f2;overflow:hidden}.bar i{display:block;height:100%;background:var(--fill)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--fill);padding:10px 18px;border-radius:20px;font-weight:600;z-index:9;max-width:90%;text-align:center}
.hero{background:linear-gradient(rgba(10,25,49,.9),rgba(10,25,49,.9)),radial-gradient(circle at 50% 30%,#C9A22766,#0A1931);color:#fff;text-align:center;padding:26px 14px;border-radius:14px;margin:6px 0 12px}
.hero h1{color:#fff}.hero .ico{font-size:52px}.hero .mut{color:#c9d3e8}.hero .q{color:#E2C25A;font-style:italic;margin-top:10px}
.opt{padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff}.opt.r{border-color:var(--ok);background:#e9f6ee}.opt.w{border-color:var(--bad);background:#fbeceb}
@keyframes fl{from{opacity:0;transform:perspective(900px) rotateY(-14deg);transform-origin:left center}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="app"></div>
<div class="nav" id="nav"></div>
<script>
const $=s=>document.querySelector(s);
const BOOKS=[['Pride and Prejudice','Jane Austen','English','Project Gutenberg','https://www.gutenberg.org/ebooks/1342'],['The Time Machine','H. G. Wells','English','Project Gutenberg','https://www.gutenberg.org/ebooks/35'],['University Physics Vol. 1','OpenStax','Physics','OpenStax','https://openstax.org/details/books/university-physics-volume-1'],['Calculus Vol. 1','OpenStax','Mathematics','OpenStax','https://openstax.org/details/books/calculus-volume-1'],['Biology 2e','OpenStax','Biology','OpenStax','https://openstax.org/details/books/biology-2e'],['Chemistry 2e','OpenStax','Chemistry','OpenStax','https://openstax.org/details/books/chemistry-2e'],['U.S. History','OpenStax','History','OpenStax','https://openstax.org/details/books/us-history'],['How to Think Like a Computer Scientist','Runestone','Computer Science','Runestone Academy','https://runestone.academy/ns/books/published/thinkcspy/index.html']];
const BANK={Mathematics:{L:['Number systems','Algebra basics','Linear equations','Geometry intro'],Q:[['If 2x + 6 = 14, what is x?',['3','4','5'],1],['Angles of a triangle add up to?',['90°','180°','360°'],1],['Square root of 144?',['10','12','14'],1]]},English:{L:['Parts of speech','Tenses','Comprehension','Essay writing'],Q:[['Which is a noun?',['Quickly','Teacher','Run'],1],['Past tense of “go”?',['Goed','Went','Gone'],1]]},'General Science':{L:['Living things','Matter and energy','Force and motion','Our planet'],Q:[['Plants make food by?',['Photosynthesis','Digestion','Evaporation'],0],['Water boils at (°C)?',['50','100','150'],1]]},'Computer Science':{L:['What is a computer','Input and output','Files and folders','Intro to coding'],Q:[['Which is an input device?',['Monitor','Keyboard','Speaker'],1],['CPU stands for?',['Central Processing Unit','Computer Power Unit','Core Print Unit'],0]]},'English IELTS':{L:['IELTS format','Listening tips','Reading skimming','Writing Task 1','Speaking Part 2'],Q:[['IELTS has how many sections?',['2','4','6'],1]]},CSS:{L:['Exam scheme','Essay','Precis and composition','Current affairs'],Q:[['CSS is held by?',['FPSC','PPSC','HEC'],0]]}};
const S={user:null,role:'',lr:'student',step:'cred',next:null,otp:null,fails:{},lock:{},full:[],att:{},msgs:[],FT:{'Matric · Class 3–10':[15000,30000],'FSc / ICS / ICom · Class 11–12':[20000,30000],'O Level / A Level':[35000,45000]},RATE:{PKR:1,USD:280,GBP:355,EUR:305},cur:'PKR',mode:0,ftype:'Online',ref:'',refUsed:false,force:false,over:0,paid:false,rc:0,tp:{fee:100000,yrs:1,bonus:5000,late:2},screen:'login',lastAct:Date.now(),portal:'Pakistani',cls:'Class 3',board:'Punjab Board',medium:'English Medium',system:'Government',religion:'Muslim',opt:['Computer Science','General Science'],stream:'FSc',courses:['English IELTS'],marketing:true,lang:'English',flip:2,last:'',course:null,tab:'Lectures',quiz:{},q:'',pay:'Bank transfer',adm:[],f:{},files:{},
 stu:{name:'Ayesha (demo student)',done:{},scores:{},dl:[],saved:[]},
 ST:[['Ali Raza','Class 9','Active'],['Sara Malik','O Level','Active'],['Hamza Khan','Class 5','Blocked']],
 PAY:[],ANN:['Welcome to the new session. Classes begin Monday.'],BK:BOOKS.slice(),post:'',reqs:[]};
const compulsory=()=>['English','Urdu','Mathematics',S.religion==='Muslim'?'Islamiat':'Ethics'];
const myCourses=()=>[...compulsory(),...S.opt,...S.courses];
const lessons=c=>(BANK[c]||{L:['Introduction','Core concepts','Practice','Revision']}).L;
const key=(c,i)=>c+'|'+i;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
const HOME={student:'home',parent:'p_home',teacher:'t_home',accountant:'a_fees',director:'a_home'};
const SCR={student:['home','lms','course','library','fees','receipt'],parent:['p_home','fees','receipt'],teacher:['t_home','t_pay'],accountant:['a_fees','a_students','a_adm','receipt'],director:['a_home','a_students','a_fees','a_lib','a_mkt','a_adm','receipt']};
const PUB=['login','about','portal','subjects','courses','summary','form','done','status','jobs','help'];
const DEMO={director:['director','Director@123'],accountant:['accountant','Account@123'],teacher:['teacher','Teacher@123'],student:['student','Student@123'],parent:['parent','Parent@123']};
function gate(s){if(PUB.includes(s))return s;if(!S.user){S.next=s;return 'login'}if(S.role==='student'&&S.over>3&&!S.paid&&['lms','course','library'].includes(s)){toast('Portal locked: fee overdue. Pay to unlock.');return 'fees'}if((SCR[S.role]||[]).includes(s))return s;toast('Your role cannot open this page');return HOME[S.role]}
function go(s,x){S.screen=gate(s);if(x!==undefined)S.course=x;render();scrollTo(0,0)}
function pickRole(v){S.lr=v.toLowerCase();render()}
function enter(r){S.user=r;S.role=r;S.step='cred';S.otp=null;S.lastAct=Date.now();const d=S.next;S.next=null;go(d||HOME[r])}
function demoIn(r){enter(r)}
function doLogin(){const k=S.lr,u=$('#lu').value.trim(),p=$('#lp').value;if(S.full.includes(k))return toast('Account fully locked. Only the Director can unlock it.');if(S.lock[k]&&Date.now()<S.lock[k])return toast('Locked for 30 minutes after 3 wrong tries.');if(u===DEMO[k][0]&&p===DEMO[k][1]){S.fails[k]=0;S.otp={c:String(Math.floor(100000+Math.random()*900000)),t:Date.now()};S.step='otp';return render()}const f=(S.fails[k]||0)+1;S.fails[k]=f;if(f>=5){S.full.push(k);toast('Fully locked. Only the Director can unlock it.')}else if(f>=3){S.lock[k]=Date.now()+30*60000;toast('3 wrong tries. Locked for 30 minutes. Admin informed (demo).')}else toast('Wrong username or password ('+f+'/3)')}
function doOtp(){const v=$('#lo').value.trim();if(Date.now()-S.otp.t>120000){S.step='cred';render();return toast('Code expired. Log in again.')}if(v!==S.otp.c)return toast('Wrong code');enter(S.lr)}
function logout(){S.user=null;S.role='';S.screen='login';render()}
function unlock(k){S.full=S.full.filter(x=>x!==k);S.fails[k]=0;delete S.lock[k];render()}
const NAMES=()=>[S.stu.name,...S.ST.filter(r=>r[2]==='Active').map(r=>r[0])];
function mark(i,v){S.att[NAMES()[i]]=v;render()}
function sendAtt(){const ab=NAMES().filter(n=>S.att[n]==='A');ab.forEach(n=>S.msgs.push('Your child '+n.split(' ')[0]+' was absent today. Is everything OK?'));toast(ab.length?ab.length+' parent message(s) sent':'Attendance saved')}
function calcPay(){document.querySelectorAll('[data-t]').forEach(e=>S.tp[e.dataset.t]=Math.max(0,+e.value||0));render()}
setInterval(()=>{if(S.user&&Date.now()-S.lastAct>600000){logout();toast('Logged out after 10 minutes without activity')}},15000);
addEventListener('click',()=>{S.lastAct=Date.now()});addEventListener('keydown',()=>{S.lastAct=Date.now()});

function chips(list,sel,fn){return `<div class="chips">${list.map(x=>`<button class="chip ${(Array.isArray(sel)?sel.includes(x):sel===x)?'on':''}" onclick="${fn}(this.dataset.v)" data-v="${x}">${x}</button>`).join('')}</div>`}
function sel(label,k,opts){return `<label>${label}</label><select onchange="S['${k}']=this.value">${opts.map(o=>`<option ${S[k]===o?'selected':''}>${o}</option>`).join('')}</select>`}
function head(t,back){return `<div class="top">${back?`<button class="back" aria-label="Back" onclick="go('${back}')">←</button>`:''}<span class="sp"></span><button class="back" onclick="go('help')">?</button></div><h2>${t}</h2>`}
function tog(k){return `<button class="tg ${S[k]?'on':''}" aria-label="toggle" onclick="S['${k}']=!S['${k}'];render()"></button>`}
function pct(c){const L=lessons(c);return Math.round(L.filter((_,i)=>S.stu.done[key(c,i)]).length/L.length*100)}
function pickOpt(x){const i=S.opt.indexOf(x);if(i>=0)S.opt.splice(i,1);else if(S.opt.length<3)S.opt.push(x);else toast('Maximum 3 optional subjects');render()}
function pickCourse(x){const i=S.courses.indexOf(x);i>=0?S.courses.splice(i,1):S.courses.push(x);render()}
function pickStream(x){S.stream=x;render()}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chk(){const v=$('#an').value.trim();const a=S.adm.find(x=>String(x.no)===v);$('#sr').innerHTML=!v?'<div class="card bad">Enter your admission number.</div>':!a?'<div class="card bad">No admission found with this number.</div>':a.st==='Active'?'<div class="card"><b class="ok">● Active</b><div class="mut">Login and password instructions go to your email. You can change the password after first login.</div></div>':a.st==='Inactive'?'<div class="card"><b class="bad">● Inactive</b><div class="mut">Reason: '+esc(a.reason)+'. Please contact the Director’s desk.</div></div>':'<div class="card"><b>● Pending</b><div class="mut">The Director is reviewing your form and documents.</div></div>'}
const CFG={url:'',token:''};
function push(kind,d){if(!CFG.url)return;try{fetch(CFG.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.token,kind,data:d})}).catch(()=>{})}catch(e){}}
function backupNow(){if(!CFG.url)return toast('Backup link is not set yet. It works once the app is on your GitHub page.');S.adm.forEach(a=>push('admission',a));S.PAY.forEach(p=>push('payment',p));S.ST.forEach(r=>push('student',{name:r[0],cls:r[1],st:r[2]}));toast('Backup sent to the Google Sheet')}
const band=()=>S.cls==='O Level'||S.cls==='A Level'?'O Level / A Level':['Class 11','Class 12'].includes(S.cls)?'FSc / ICS / ICom · Class 11–12':'Matric · Class 3–10';
function muharram(){try{const m=new Intl.DateTimeFormat('en-u-ca-islamic',{month:'numeric'}).formatToParts(new Date()).find(p=>p.type==='month').value;return +m===1}catch(e){return false}}
function quote(){const base=S.FT[band()][S.mode];const refOk=S.adm.some(a=>'ADM-'+a.no===S.ref)&&!S.refUsed;const muh=muharram()||S.force;const d=Math.max(muh?30:0,refOk?10:0);return {base,d,refOk,net:base*(1-d/100),label:d===30?'Muharram offer 30% off':d===10?'Referral 10% off (first month)':'No discount'}}
function fmt(pkr,cur){cur=cur||S.cur;return (cur==='PKR'?'Rs ':{USD:'$',GBP:'£',EUR:'€'}[cur])+Math.round(pkr/S.RATE[cur]).toLocaleString('en-US')}
function pickMode(v){S.mode=v.startsWith('One')?1:0;render()}
function pickType(v){S.ftype=v;render()}
function pickCur(v){S.cur=v;render()}
function saveFees(){document.querySelectorAll('[data-fb]').forEach(e=>{S.FT[e.dataset.fb][+e.dataset.fm]=+e.value||0});document.querySelectorAll('[data-rc]').forEach(e=>{S.RATE[e.dataset.rc]=+e.value||1});toast('Fees saved');render()}
function sendRem(){const n=S.stu.name.split(' ')[0];S.msgs.push('Fee reminder: '+n+'’s fee is due in 3 days.','Fee reminder: '+n+'’s fee is due today.','Fee reminder: '+n+'’s fee is overdue.');toast('3 reminders saved as portal notifications')}
function showRc(i){S.rc=i;go('receipt')}
function saveF(){document.querySelectorAll('[data-f]').forEach(e=>S.f[e.dataset.f]=e.type==='checkbox'?e.checked:e.value)}
function fileSel(k,inp){saveF();const f=inp.files[0];if(!f)return;if(f.size>2*1024*1024){inp.value='';return toast('File is over 2 MB. Choose a smaller one.')}S.files[k]={n:f.name,s:Math.round(f.size/1024)};if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{S.files[k].u=r.result;render()};r.readAsDataURL(f)}else render()}
function submitAdm(){saveF();if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/.test(S.f.password||''))return toast('Password needs 8+ characters with a capital, a small letter, a number and a symbol');if(!S.f.cons)return toast('Parent consent is required');if(!S.f.name||!S.f.father||!S.f.phone)return toast('Fill name, guardian and phone');if(!S.files.photo||!S.files.bform)return toast('Attach the photo and the B-Form / CNIC');const no=1001+S.adm.length;S.adm.push({no,name:S.f.name,cls:S.cls,n:Object.keys(S.files).length,st:'Pending',reason:''});S.lastNo=no;push('admission',{no,name:S.f.name,father:S.f.father,phone:S.f.phone,cls:S.cls,board:S.board});delete S.f.password;go('done')}
function decide(i,s){const a=S.adm[i];a.st=s;if(s==='Inactive')a.reason=document.getElementById('rs'+i).value;else S.ST.push([a.name,a.cls,'Active']);render()}
function done(c,i){const k=key(c,i);S.stu.done[k]=!S.stu.done[k];render()}
function ans(c,qi,oi){S.quiz[c+qi]=oi;const Q=BANK[c].Q;if(Q.every((_,n)=>S.quiz[c+n]!==undefined))S.stu.scores[c]=Q.filter((q,n)=>S.quiz[c+n]===q[2]).length+'/'+Q.length;render()}
function retry(c){BANK[c].Q.forEach((_,n)=>delete S.quiz[c+n]);delete S.stu.scores[c];render()}
function getBook(i,dl){const b=S.BK[i];if(dl&&!S.stu.dl.includes(b[0]))S.stu.dl.push(b[0]);window.open(b[4],'_blank','noopener');render()}
function saveBook(i){const t=S.BK[i][0];const k=S.stu.saved.indexOf(t);k>=0?S.stu.saved.splice(k,1):S.stu.saved.push(t);render()}
function payNow(){const q=quote();const p={n:'R-'+(1000+S.PAY.length+1),a:q.net,base:q.base,d:q.d,disp:fmt(q.net),m:S.pay,st:'Pending',date:new Date().toLocaleDateString('en-GB'),who:S.stu.name,cls:S.cls,mode:['Group','One-to-one'][S.mode],ft:S.ftype};S.PAY.push(p);if(q.refOk)S.refUsed=true;S.msgs.push('Thank you. Fee '+p.disp+' for '+S.stu.name.split(' ')[0]+' has been received. Receipt '+p.n+' follows after approval.');push('payment',p);toast('Thank you. Sent for approval');render()}
function approve(i){const p=S.PAY[i];p.st='Approved';S.paid=true;S.msgs.push('Receipt '+p.n+' has been issued for '+S.stu.name.split(' ')[0]+'. Portal is unlocked.');push('payment',p);render()}
function addBook(){const t=$('#bt').value.trim(),u=$('#bu').value.trim();if(!t||!/^https?:/.test(u))return toast('Enter a title and a full link');S.BK.push([t,'Added by Director','General','Link',u]);render()}
function rmBook(i){S.BK.splice(i,1);render()}
function addStu(){const n=$('#sn').value.trim();if(!n)return;S.ST.push([n,$('#sc').value,'Active']);render()}
function stuAct(i,a){const r=S.ST[i];if(a==='b')r[2]=r[2]==='Blocked'?'Active':'Blocked';else{const L=['Class 3','Class 5','Class 8','Class 9','Class 10','Class 11','Class 12'];const k=L.indexOf(r[1]);if(k>=0&&k<L.length-1)r[1]=L[k+1]}render()}
function postAnn(){const t=$('#an2').value.trim();if(t){S.ANN.unshift(t);toast('Published to all students')}render()}
function genPost(){if(!S.marketing)return toast('Marketing is OFF');const c=$('#pc').value,l=$('#pl').value;S.post=l==='Urdu'?`نیا کورس: ${c}۔ آج ہی داخلہ لیں! سر ہارون جاوید ہاشمی گلوبل اکیڈمی اینڈ کالج`:`New course: ${c}. Enroll today at Sir Haroon Javaid Hashmi Global Academy & College.`;render()}
function sendHelp(){const t=$('#hm').value.trim();if(!t)return toast('Write a message first');S.reqs.unshift([S.priority||'Normal',t]);toast('Sent to Director');render()}
const V={
home:()=>`<div class="hero"><div class="ico">🎓</div><h1>Welcome</h1><div class="mut">Sir Haroon Javaid Hashmi<br>Global Academy &amp; College</div><div class="q">“A man can be destroyed but not defeated”</div></div>
${S.ANN.slice(0,2).map(a=>`<div class="news">📢 ${a}</div>`).join('')}
<div class="card"><b>Hello, ${S.stu.name}</b><div class="mut">${S.cls} · ${myCourses().length} courses · ${S.stu.dl.length} books downloaded</div><button class="btn" onclick="go('lms')">Continue studying</button></div>
<div class="card row"><div><div class="mut">Page-flip speed</div>Book turn</div><select style="width:auto" onchange="S.flip=+this.value"><option value="1" ${S.flip==1?'selected':''}>1s Fast</option><option value="2" ${S.flip==2?'selected':''}>2s Normal</option><option value="3" ${S.flip==3?'selected':''}>3s Slow</option></select></div>
${S.msgs.filter(m=>m.includes(S.stu.name.split(' ')[0])).slice(-3).map(m=>`<div class="news">🔔 ${esc(m)}</div>`).join('')}<h3>New admission</h3><button class="btn" onclick="go('portal')">Start admission form</button><div class="grid g2"><button class="tile" onclick="S.portal='Pakistani';go('portal')"><div class="ico">🎓</div><b>Pakistani Students</b></button><button class="tile" onclick="S.portal='International';go('portal')"><div class="ico">🌐</div><b>International Students</b></button><button class="tile" onclick="go('jobs')"><div class="ico">💼</div><b>CV &amp; Job Portal</b></button><button class="tile" onclick="go('status')"><div class="ico">✅</div><b>Check status</b></button></div>`,
portal:()=>head(S.portal+' portal setup','home')+sel('Class','cls',['Class 3','Class 5','Class 8','Class 9','Class 10','Class 11','Class 12','O Level','A Level'])+sel('Board','board',['Punjab Board','KPK / Sarhad Board','Sindh Board','Balochistan Board','AJK Board','Federal Board'])+sel('Medium','medium',['Urdu Medium','English Medium','Mix Medium'])+sel('School system','system',['Root System','American Lyceum System','Beaconhouse System','Government','General for Pakistan','USA / UK / Europe System'])+sel('Religion (decides the locked subject)','religion',['Muslim','Hindu','Christian','Other'])+`<button class="btn" onclick="go('subjects')">Continue to subjects</button>`,
subjects:()=>head('Subjects','portal')+`<div class="card"><b>🔒 Compulsory</b><div class="chips" style="margin-top:8px">${compulsory().map(x=>`<span class="chip lock">🔒 ${x}</span>`).join('')}</div></div><h3>Optional subjects (up to 3)</h3>${chips(['Computer Science','General Science','Drawing','Urdu Literature','Home Economics','Arabic'],S.opt,'pickOpt')}<h3>Stream / cluster</h3>${chips(['Arts','Science','Commerce','FSc','ICS','ICom','Pre-Medical','Pre-Engineering','FA'],S.stream,'pickStream')}<button class="btn" onclick="go('courses')">Continue to courses</button>`,
courses:()=>head('Courses','subjects')+`<div class="card"><b>🏆 Competitive</b><div style="margin-top:8px">${chips(['CSS','PMS','Tehsildar','PPSC','MDCAT','ECAT'],S.courses,'pickCourse')}</div></div><div class="card"><b>🌐 Languages</b><div style="margin-top:8px">${chips(['Urdu','English IELTS','Spanish','German','French','Arabic','Chinese'],S.courses,'pickCourse')}</div></div><button class="btn" onclick="go('summary')">See summary</button>`,
summary:()=>head('Admission summary','courses')+`<div class="card">${[['Portal',S.portal],['Class',S.cls],['Board',S.board],['Medium',S.medium],['System',S.system],['Subjects',myCourses().join(', ')]].map(([a,b])=>`<div class="row" style="padding:5px 0"><span style="color:var(--gold)">${a}</span><span style="text-align:right">${b}</span></div>`).join('')}</div><button class="btn" onclick="go('form')">Continue to admission form</button>`,
lms:()=>head('My study space',null)+`<div class="mut">${S.stu.name} · ${S.cls}</div>`+myCourses().map(c=>`<button class="card row" style="width:100%;color:var(--tx);font:inherit;text-align:left;cursor:pointer" onclick="S.tab='Lectures';go('course','${c}')"><div><b>${c}</b><div class="mut">${lessons(c).length} lessons${S.stu.scores[c]?' · quiz '+S.stu.scores[c]:''}</div></div><div style="width:70px"><div class="bar"><i style="width:${pct(c)}%"></i></div><div class="mut" style="text-align:right">${pct(c)}%</div></div></button>`).join(''),
course:()=>{const c=S.course,L=lessons(c),B=BANK[c];const tabs=['Lectures','Notes','Quiz'];return head(c,'lms')+chips(tabs,S.tab,'(v=>{S.tab=v;render()})')+(S.tab==='Lectures'?L.map((l,i)=>`<div class="card row"><div><b>${i+1}. ${l}</b><div class="mut">Video lecture · 12 min</div></div><button class="chip ${S.stu.done[key(c,i)]?'on':''}" onclick="done('${c}',${i})">${S.stu.done[key(c,i)]?'Done ✓':'Mark done'}</button></div>`).join(''):S.tab==='Notes'?`<div class="card">Reference books for ${c} are in the library.</div><button class="btn" onclick="go('library')">Open library</button>`:(B?B.Q.map((q,n)=>{const a=S.quiz[c+n];return `<div class="card"><b>${n+1}. ${q[0]}</b>${q[1].map((o,k)=>`<div class="opt ${a===undefined?'':k===q[2]?'r':k===a?'w':''}" onclick="${a===undefined?`ans('${c}',${n},${k})`:''}">${o}</div>`).join('')}</div>`}).join('')+(S.stu.scores[c]?`<div class="card"><b>Score: ${S.stu.scores[c]}</b></div><button class="btn o" onclick="retry('${c}')">Try again</button>`:''):`<div class="card mut">No questions yet for this course. The Director can add them.</div>`))},
library:()=>head('Digital library',null)+`<input placeholder="Search by title, author or subject" value="${S.q}" oninput="S.q=this.value;render();document.querySelector('input').focus()"><div class="mut" style="margin:8px 0">Free and legal books from OpenStax, Project Gutenberg and Runestone. “Download” opens the book’s official page to save it.</div>`+S.BK.map((b,i)=>[b,i]).filter(([b])=>(b.join(' ')).toLowerCase().includes(S.q.toLowerCase())).map(([b,i])=>`<div class="card"><b>📘 ${b[0]}</b><div class="mut">${b[1]} · ${b[2]} · ${b[3]}</div><div class="grid g2" style="margin-top:8px"><button class="btn" style="margin:0" onclick="getBook(${i},1)">${S.stu.dl.includes(b[0])?'Downloaded ✓':'⬇ Download'}</button><button class="btn o" style="margin:0" onclick="saveBook(${i})">${S.stu.saved.includes(b[0])?'Saved ✓':'Save'}</button></div></div>`).join('')+`<h3>My library</h3><div class="card row"><span>Saved</span><b>${S.stu.saved.length}</b></div><div class="card row"><span>Downloaded</span><b>${S.stu.dl.length}</b></div>`,
fees:()=>{const q=quote();return head('Fees',null)+(S.over>3&&!S.paid?`<div class="news">🔒 Portal is locked because the fee is more than 3 days late. It unlocks as soon as the payment is approved.</div>`:'')+`<div class="card"><b>${band()}</b><div class="mut">${S.cls} · ${S.board}</div></div><label>Class type</label>${chips(['Group class','One-to-one class'],['Group class','One-to-one class'][S.mode],'pickMode')}<label>Study type</label>${chips(['Online','Physical','Hybrid'],S.ftype,'pickType')}<label>Currency</label>${chips(['PKR','USD','GBP','EUR'],S.cur,'pickCur')}<label>Referral code (an admission number, like ADM-1001)</label><input value="${esc(S.ref)}" placeholder="ADM-1001" onchange="S.ref=this.value.trim().toUpperCase();render()"><div class="card"><div class="row"><span>Monthly fee</span><b>${fmt(q.base)}</b></div>${q.d?`<div class="row ok"><span>${q.label}</span><b>- ${fmt(q.base-q.net)}</b></div>`:''}<div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><b>You pay</b><b class="big" style="font-size:22px">${fmt(q.net)}</b></div></div>${sel('Pay with','pay',['Bank transfer','JazzCash','EasyPaisa','Card'])}<button class="btn" onclick="payNow()">Pay now</button><h3>My receipts</h3>${S.PAY.length?S.PAY.map((p,i)=>`<button class="card row" style="width:100%;font:inherit;color:var(--tx);text-align:left;cursor:pointer" onclick="showRc(${i})"><div><b>${p.n}</b><div class="mut">${p.m} · ${p.disp}</div></div><b class="${p.st==='Approved'?'ok':'bad'}">${p.st}</b></button>`).join(''):'<div class="card mut">No payments yet.</div>'}`},
receipt:()=>{const p=S.PAY[S.rc];if(!p)return head('Receipt','fees')+'<div class="card mut">No receipt selected.</div>';return head('Receipt',HOME[S.role])+`<div class="card"><div class="mut">Sir Haroon Javaid Hashmi Academy</div><div class="big">${p.n}</div><div class="${p.st==='Approved'?'ok':'bad'}"><b>${p.st}</b></div>${[['Student',esc(p.who)],['Class',p.cls],['Type',p.mode+' · '+p.ft],['Date',p.date],['Monthly fee',fmt(p.base)],['Discount',p.d+'%'],['Paid',p.disp],['Method',p.m]].map(([a,b])=>`<div class="row" style="padding:4px 0"><span class="mut">${a}</span><b>${b}</b></div>`).join('')}</div><button class="btn" onclick="window.print()">Print or save as PDF</button>`},

form:()=>{const F=(l,k,t)=>`<label>${l}</label><input data-f="${k}" type="${t||'text'}" value="${esc(S.f[k]||'')}">`;const U=(k,l,acc)=>`<div class="card"><b>${l}</b><div class="mut">${S.files[k]?esc(S.files[k].n)+' · '+S.files[k].s+' KB':'Not attached (max 2 MB)'}</div>${S.files[k]&&S.files[k].u?`<img alt="" src="${S.files[k].u}" style="width:70px;height:70px;object-fit:cover;border-radius:10px;margin-top:6px">`:''}<input type="file" accept="${acc}" onchange="fileSel('${k}',this)" style="margin-top:8px"></div>`;return head('Admission form','summary')+`<div class="card mut">${S.portal} portal · ${S.cls} · ${S.board} · ${S.medium}</div>`+F('Student full name','name')+F('Father / guardian name','father')+F('Date of birth','dob','date')+`<label>Gender</label><select data-f="gender">${['Male','Female'].map(o=>`<option ${S.f.gender===o?'selected':''}>${o}</option>`).join('')}</select>`+F('Phone / WhatsApp','phone','tel')+F('Email','email','email')+F('Create a password (8+ characters, capital, small, number, symbol)','password','password')+F('Home address','address')+F('Previous school','school')+`<h3>Documents</h3>`+U('photo','Student photo (required)','image/*')+U('bform','B-Form or CNIC (required)','image/*,.pdf')+U('result','Previous result card','image/*,.pdf')+U('slip','Fee payment slip','image/*,.pdf')+`<h3>Parent consent</h3><div class="card"><div class="mut">I agree that: classes are recorded; my child’s name, photo and result may appear on the academy page (I can refuse); fees are paid on time or the portal locks; I will follow academy rules; the academy may contact me on WhatsApp and SMS.</div><label style="font-weight:400"><input data-f="cons" type="checkbox" style="width:auto" ${S.f.cons?'checked':''}> I agree</label></div><button class="btn" onclick="submitAdm()">Submit admission form</button>`},
done:()=>head('Form submitted',null)+`<div class="card"><div class="mut">Your admission number</div><div class="big">${S.lastNo}</div><div class="mut">Keep this number. Use it to check your status. It is also your referral code: ADM-${S.lastNo}.</div></div><button class="btn" onclick="go('status')">Check status</button><button class="btn o" onclick="go('login')">Back to start</button>`,
a_adm:()=>head('Admissions','a_home')+(S.adm.length?S.adm.map((a,i)=>`<div class="card"><div class="row"><b>${esc(a.name)} · #${a.no}</b><span class="${a.st==='Active'?'ok':a.st==='Inactive'?'bad':''}">${a.st}</span></div><div class="mut">${a.cls} · ${a.n} documents attached${a.reason?' · '+esc(a.reason):''}</div>${a.st==='Pending'&&S.role==='director'?`<select id="rs${i}" style="margin-top:8px"><option>Fee pending</option><option>Documents missing</option><option>Class full</option></select><div class="grid g2" style="margin-top:8px"><button class="chip on" onclick="decide(${i},'Active')">Activate</button><button class="chip" onclick="decide(${i},'Inactive')">Mark inactive</button></div>`:''}</div>`).join(''):'<div class="card mut">No forms yet. Submit one from the start page.</div>'),
login:()=>{const R=['Director','Accountant','Teacher','Student','Parent'];return `<div class="hero"><div class="ico">🎓</div><h1>Welcome</h1><div class="mut">Sir Haroon Javaid Hashmi Academy</div><div class="q">“A man can be destroyed but not defeated”</div></div>`+(S.step==='otp'?`<div class="card"><b>Enter the 6-digit code</b><div class="mut">Demo code (SMS is not connected yet): <b>${S.otp.c}</b>. It expires in 2 minutes.</div><input id="lo" inputmode="numeric" maxlength="6" placeholder="000000" style="margin-top:8px"></div><button class="btn" onclick="doOtp()">Verify and enter</button><button class="btn o" onclick="S.step='cred';render()">Back</button>`:`${chips(R,S.lr.charAt(0).toUpperCase()+S.lr.slice(1),'pickRole')}<label>Username</label><input id="lu" autocomplete="off"><label>Password</label><input id="lp" type="password" autocomplete="off"><button class="btn" onclick="doLogin()">Log in</button><div class="mut">3 wrong tries lock the account for 30 minutes. 5 wrong tries lock it fully until the Director unlocks it.</div><h3>Demo accounts for review</h3><div class="card mut">Tap a role to enter without a password. These are practice accounts. Never type a real password into this demo.</div><div class="grid g3">${R.map(r=>`<button class="chip" onclick="demoIn('${r.toLowerCase()}')">${r}</button>`).join('')}</div><h3>New here?</h3><button class="btn" onclick="go('portal')">Start admission form</button><button class="btn o" onclick="go('about')">About the Director</button><div class="grid g2"><button class="btn o" onclick="go('status')">Check status</button><button class="btn o" onclick="go('jobs')">Apply as teacher</button></div>`)},
p_home:()=>{const avg=Math.round(myCourses().reduce((a,c)=>a+pct(c),0)/myCourses().length);const my=S.msgs.filter(m=>m.includes(S.stu.name.split(' ')[0]));return head('My child',null)+`<div class="card"><b>${S.stu.name}</b><div class="mut">${S.cls} · ${S.board}</div></div><div class="grid g2"><div class="tile"><small>Study progress</small><div class="big">${avg}%</div></div><div class="tile"><small>Receipts approved</small><div class="big">${S.PAY.filter(p=>p.st==='Approved').length}/${S.PAY.length}</div></div></div><h3>Messages from the academy</h3>${my.length?my.map(m=>`<div class="news">${esc(m)}</div>`).join(''):'<div class="card mut">No messages today.</div>'}<h3>Announcements</h3>${S.ANN.map(a=>`<div class="news">📢 ${esc(a)}</div>`).join('')}`},
t_home:()=>head('My class · '+S.cls,null)+`<div class="mut">Mark today’s attendance. Parents of absent students get a message.</div>`+NAMES().map((n,i)=>`<div class="card row"><b>${esc(n)}</b><div class="chips"><button class="chip ${S.att[n]==='P'?'on':''}" onclick="mark(${i},'P')">Present</button><button class="chip ${S.att[n]==='A'?'on':''}" onclick="mark(${i},'A')">Absent</button></div></div>`).join('')+`<button class="btn" onclick="sendAtt()">Submit attendance</button>`,
t_pay:()=>{const t=S.tp,b=t.fee*0.6,inc=b*(Math.pow(1.15,t.yrs)-1),cut=t.late*500,tot=b+inc+t.bonus-cut,f=n=>'Rs '+Math.round(n).toLocaleString('en-US');return head('My pay',null)+`<div class="card mut">Pay is 60% of the fee collected from your students, plus 15% for each year of service, plus bonus, minus Rs 500 for each late day.</div><label>Fee collected (Rs)</label><input data-t="fee" type="number" value="${t.fee}"><label>Years of service</label><input data-t="yrs" type="number" value="${t.yrs}"><label>Bonus (Rs)</label><input data-t="bonus" type="number" value="${t.bonus}"><label>Late days</label><input data-t="late" type="number" value="${t.late}"><button class="btn" onclick="calcPay()">Calculate pay slip</button><div class="card">${[['Base (60%)',f(b)],['Increment',f(inc)],['Bonus',f(t.bonus)],['Late deduction','- '+f(cut)]].map(([a,c])=>`<div class="row" style="padding:4px 0"><span>${a}</span><b>${c}</b></div>`).join('')}<div class="row" style="border-top:1px solid var(--line);padding-top:8px"><b>Total pay</b><b class="big" style="font-size:20px">${f(tot)}</b></div></div>`},
status:()=>head('Admission status','home')+`<label>Admission number</label><input id="an" inputmode="numeric" placeholder="e.g. 1042"><button class="btn" onclick="chk()">Check status</button><div id="sr"></div><div class="mut">Use the number you received after submitting your admission form.</div>`,
jobs:()=>head('CV &amp; job portal','home')+`<label>Full name</label><input><label>Qualification</label><input><label>Skills</label><textarea rows="3"></textarea><button class="btn" onclick="toast('Application sent to Director')">Submit application</button>`,
help:()=>head('Help desk',HOME[S.role]||'login')+chips(['Urgent','Normal','Feedback'],S.priority||'Normal','(v=>{S.priority=v;render()})')+`<label>Your message</label><textarea id="hm" rows="4"></textarea><button class="btn" onclick="sendHelp()">Send to Director’s desk</button>`,
a_home:()=>head('Director’s control room',null)+`<div class="card"><b>🛡️ Sir Haroon Javaid Hashmi</b></div><div class="grid g3"><div class="tile"><b class="big">${S.ST.length+1}</b><small>Students</small></div><div class="tile"><b class="big">${S.PAY.filter(p=>p.st==='Pending').length}</b><small>Payments to approve</small></div><div class="tile"><b class="big">${S.reqs.length}</b><small>Help requests</small></div></div>
<div class="grid g2" style="margin-top:10px">${[['👥','Students','a_students'],['💳','Fees','a_fees'],['📚','Library','a_lib'],['📝','Admissions','a_adm'],['📣','Marketing &amp; notices','a_mkt']].map(t=>`<button class="tile" onclick="go('${t[2]}')"><div class="ico">${t[0]}</div><b>${t[1]}</b></button>`).join('')}</div>
<h3>Backup</h3><div class="card"><div class="mut">The app file is kept on GitHub. Data goes to a private Google Sheet with a nightly copy in Drive.</div><button class="btn o" onclick="backupNow()">Back up now</button></div>${S.full.length?`<h3>Locked accounts</h3>${S.full.map(k=>`<div class="card row"><b>${k}</b><button class="chip on" onclick="unlock('${k}')">Unlock</button></div>`).join('')}`:''}<h3>Help requests</h3>${S.reqs.length?S.reqs.map(r=>`<div class="card"><b>${r[0]}</b><div>${r[1]}</div></div>`).join(''):'<div class="card mut">None yet.</div>'}`,
a_students:()=>head('Students','a_home')+`<div class="card"><div class="row"><span>${S.stu.name}</span><span class="ok">Active</span></div><div class="mut">${S.cls} · ${myCourses().length} courses · ${Math.round(myCourses().reduce((a,c)=>a+pct(c),0)/myCourses().length)}% done</div></div>`+S.ST.map((r,i)=>`<div class="card"><div class="row"><b>${r[0]}</b><span class="${r[2]==='Active'?'ok':'bad'}">${r[2]}</span></div><div class="mut">${r[1]}</div>${S.role==='director'?`<div class="grid g2" style="margin-top:8px"><button class="chip" onclick="stuAct(${i},'b')">${r[2]==='Blocked'?'Unblock':'Block'}</button><button class="chip" onclick="stuAct(${i},'p')">Promote</button></div>`:''}</div>`).join('')+`<h3>Add student</h3><input id="sn" placeholder="Name"><label>Class</label><select id="sc"><option>Class 3</option><option>Class 5</option><option>Class 9</option><option>Class 10</option></select><button class="btn" onclick="addStu()">Add</button>`,
a_fees:()=>{const D=S.role==='director';return head('Fees & payments','a_home'===HOME[S.role]?'a_home':null)+`<h3>Monthly fee table (Rs)</h3><div class="mut">Examples only. The Director sets the real fees.</div>${Object.keys(S.FT).map(k=>`<div class="card"><b>${k}</b><div class="grid g2"><div><label>Group</label><input type="number" data-fb="${k}" data-fm="0" value="${S.FT[k][0]}" ${D?'':'disabled'}></div><div><label>One-to-one</label><input type="number" data-fb="${k}" data-fm="1" value="${S.FT[k][1]}" ${D?'':'disabled'}></div></div></div>`).join('')}<h3>Rupees per 1 unit of foreign currency</h3><div class="grid g3">${['USD','GBP','EUR'].map(c=>`<div><label>${c}</label><input type="number" data-rc="${c}" value="${S.RATE[c]}" ${D?'':'disabled'}></div>`).join('')}</div>${D?'<button class="btn" onclick="saveFees()">Save fees</button>':''}<h3>Offers and rules</h3><div class="card row"><div><b>Muharram 30% off</b><div class="mut">${muharram()?'Muharram is running now':'Applies by itself in Muharram'}</div></div>${tog('force')}</div><div class="card"><div class="mut">Test the portal lock: days late</div><div class="chips" style="margin-top:6px">${[0,2,4].map(n=>`<button class="chip ${S.over===n?'on':''}" onclick="S.over=${n};render()">${n}</button>`).join('')}</div></div><button class="btn o" onclick="sendRem()">Send the 3 fee reminders</button><h3>Payments</h3>${S.PAY.length?S.PAY.map((p,i)=>`<div class="card row"><div><b>${p.n} · ${p.disp}</b><div class="mut">${p.m} · ${p.mode}</div></div>${p.st==='Pending'?`<button class="chip on" onclick="approve(${i})">Approve</button>`:`<button class="chip" onclick="showRc(${i})">Receipt</button>`}</div>`).join(''):'<div class="card mut">No payments yet. Use Pay now in the student view.</div>'}`},
a_lib:()=>head('Library control','a_home')+S.BK.map((b,i)=>`<div class="card row"><div><b>${b[0]}</b><div class="mut">${b[3]}</div></div><button class="chip" onclick="rmBook(${i})">Remove</button></div>`).join('')+`<h3>Add a book</h3><input id="bt" placeholder="Title"><label>Link to the book</label><input id="bu" placeholder="https://…"><button class="btn" onclick="addBook()">Add book</button>`,
a_mkt:()=>head('Marketing &amp; notices','a_home')+`<div class="card row"><b>Auto-marketing</b>${tog('marketing')}</div><label>Course</label><select id="pc">${['English IELTS','CSS','MDCAT','German','Mathematics'].map(c=>`<option>${c}</option>`).join('')}</select><label>Language</label><select id="pl"><option>English</option><option>Urdu</option></select><button class="btn" onclick="genPost()">Generate post</button>${S.post?`<div class="card">${S.post}<button class="btn o" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.post);toast('Copied')">Copy to share</button></div>`:''}<h3>Announcement for students</h3><textarea id="an2" rows="3"></textarea><button class="btn" onclick="postAnn()">Publish announcement</button>`
};
function render(){const a=$('#app');
const N={student:[['home','🏠','Home'],['lms','🎓','Study'],['library','📚','Library'],['fees','💳','Fees'],['help','❓','Help']],parent:[['p_home','👨‍👩‍👧','Child'],['fees','💳','Fees'],['help','❓','Help']],teacher:[['t_home','🧑‍🏫','Class'],['t_pay','💰','Pay'],['help','❓','Help']],accountant:[['a_fees','💳','Fees'],['a_students','👥','Students'],['a_adm','📝','Admissions'],['help','❓','Help']],director:[['a_home','🛡️','Control'],['a_students','👥','Students'],['a_fees','💳','Fees'],['a_lib','📚','Library'],['a_mkt','📣','Notices']]};
const nav=N[S.role]||[];const grp={course:'lms'};const cur=grp[S.screen]||S.screen;
a.innerHTML=`<div class="hd"><div class="logo">HJ</div><div class="nm">SIR HAROON JAVAID HASHMI ACADEMY</div>${S.user?`<button class="out" onclick="logout()">Log out</button>`:''}</div>`+V[S.screen]();
if(S.screen!==S.last){a.style.animation='none';a.offsetWidth;a.style.animation='fl '+S.flip+'s ease-out';S.last=S.screen}
const nv=$('#nav');nv.style.display=nav.length?'flex':'none';
nv.innerHTML=nav.map(n=>`<button class="${n[0]===cur?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
const HR={'login':'login','admission-form':'form','start':'portal','subjects':'subjects','courses':'courses','summary':'summary','status':'status','study':'lms','library':'library','fees':'fees','help':'help','jobs':'jobs','director':'a_home','students':'a_students','payments':'a_fees','library-control':'a_lib','marketing':'a_mkt','admissions':'a_adm','teacher':'t_home','teacher-pay':'t_pay','parent':'p_home','director-profile':'about'};
function fromHash(){const h=location.hash.slice(1);if(HR[h])go(HR[h])}
addEventListener('hashchange',fromHash);render();fromHash();
</script></body></html>
