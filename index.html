<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sir Haroon Javaid Hashmi Global Academy &amp; College</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071224;--card:#0E203D;--line:#C9A227;--fill:#C9A227;--gold:#E2C25A;--gold2:#0A1931;--navy:#0A1931;--tx:#F4F7FC;--mut:#B8C6DF;--ok:#25A85C;--bad:#E05246;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 0%,#16325B 0%,#071224 72%);color:var(--tx);font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.6;display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:460px;min-height:100vh;padding:14px 14px 96px;position:relative}
#app::after{content:"";position:fixed;right:max(8px,calc(50% - 222px));bottom:74px;width:32px;height:32px;background:linear-gradient(135deg,transparent 50%,rgba(226,194,90,.35) 50%,rgba(201,162,39,.75) 100%);border-top-left-radius:10px;box-shadow:-2px -2px 6px rgba(0,0,0,.45);pointer-events:none;z-index:4}
h1,h2{color:#fff;font-weight:700;margin:6px 0 12px;text-align:center}h1{font-size:28px}h2{font-size:22px}
h3{font-size:15px;margin:18px 0 8px;color:var(--gold)}
.hd{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#08152B,#11274A);border:1px solid rgba(201,162,39,.55);border-bottom:3px solid var(--fill);padding:10px 12px;margin:-14px -14px 12px;border-radius:0 0 14px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--fill);background:rgba(201,162,39,.12);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.nm{flex:1;color:#fff;font-weight:700;font-size:clamp(8px,2.5vw,11.5px);white-space:nowrap;text-align:right;overflow:hidden;text-overflow:ellipsis}
.snd{background:rgba(201,162,39,.14);border:1px solid var(--fill);color:var(--gold);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;flex:none}
.snd.off{opacity:.65;border-color:#7d89a3;color:#cdd6ea}
.out{background:none;border:1px solid var(--fill);color:var(--gold);border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer;flex:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.back{background:#12274A;border:1px solid rgba(201,162,39,.5);color:var(--gold);border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer}
.sp{flex:1}
.card{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:14px;padding:13px;margin:9px 0;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:1px solid rgba(201,162,39,.45);border-radius:14px;padding:14px 8px;text-align:center;color:var(--tx);font:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tile b{display:block;color:#fff;margin:4px 0}.tile small{color:var(--mut)}
.ico{font-size:26px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:linear-gradient(180deg,#E2C25A,#C9A227);color:#0A1931;font:inherit;font-weight:700;font-size:16px;margin:8px 0;cursor:pointer;box-shadow:0 3px 10px rgba(201,162,39,.25)}
.btn.o{background:#102342;border:1.5px solid var(--fill);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid rgba(201,162,39,.45);background:#102342;color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:var(--fill);color:#0A1931;font-weight:700;border-color:var(--gold)}
.chip.lock{opacity:.9;border-style:dashed;background:#162c52;color:var(--gold)}
label{display:block;color:var(--gold);font-weight:600;font-size:13px;margin:12px 0 6px}
select,input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid rgba(201,162,39,.5);background:#09172E;color:#fff;font:inherit}
.mut{color:var(--mut);font-size:13px}.big{font-size:26px;font-weight:700;color:var(--gold)}
.ok{color:#4CE08A}.bad{color:#FF7B6E}
.tg{width:48px;height:26px;border-radius:14px;background:#3a4866;border:1px solid rgba(201,162,39,.4);position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--fill)}.tg.on::after{left:24px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;background:linear-gradient(90deg,#08152B,#11274A);border-top:3px solid var(--fill);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;background:none;border:0;color:#b8c2d9;padding:9px 0;font:inherit;font-size:11px;cursor:pointer}
.nav button.on{color:#E2C25A;font-weight:700}.nav span{display:block;font-size:19px}
.news{background:rgba(201,162,39,.14);border:1px solid var(--fill);color:#FFF3C4;border-radius:12px;padding:10px;font-size:13px;margin:6px 0}
.bar{height:7px;border-radius:4px;background:#1c3156;overflow:hidden}.bar i{display:block;height:100%;background:var(--fill)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0A1931;color:#fff;border:1.5px solid var(--fill);padding:10px 18px;border-radius:20px;font-weight:600;z-index:9;max-width:90%;text-align:center}
.hero{background:linear-gradient(160deg,rgba(14,32,61,.95),rgba(7,18,36,.98)),radial-gradient(circle at 50% 25%,rgba(201,162,39,.35),transparent 65%);border:1px solid rgba(201,162,39,.55);color:#fff;text-align:center;padding:24px 14px;border-radius:14px;margin:6px 0 12px}
.hero h1{color:#fff}.hero .ico{font-size:50px}.hero .mut{color:#c9d3e8}.hero .q{color:#E2C25A;font-style:italic;margin-top:10px}
.opt{padding:12px;border:1px solid rgba(201,162,39,.4);border-radius:10px;margin:6px 0;cursor:pointer;background:#102342;color:#fff}.opt.r{border-color:var(--ok);background:#143d29}.opt.w{border-color:var(--bad);background:#441916}
.audio-pill{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid rgba(201,162,39,.45);background:#09172E;color:var(--gold);display:inline-block;margin-bottom:8px}
@keyframes fl{from{opacity:0;transform:perspective(900px) rotateY(-14deg);transform-origin:left center}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="app"></div>
<div class="nav" id="nav"></div>
<script>
const $=s=>document.querySelector(s);
const BOOKS=[['Pride and Prejudice','Jane Austen','English','Project Gutenberg','https://www.gutenberg.org/ebooks/1342'],['The Time Machine','H. G. Wells','English','Project Gutenberg','https://www.gutenberg.org/ebooks/35'],['University Physics Vol. 1','OpenStax','Physics','OpenStax','https://openstax.org/details/books/university-physics-volume-1'],['Calculus Vol. 1','OpenStax','Mathematics','OpenStax','https://openstax.org/details/books/calculus-volume-1'],['Biology 2e','OpenStax','Biology','OpenStax','https://openstax.org/details/books/biology-2e'],['Chemistry 2e','OpenStax','Chemistry','OpenStax','https://openstax.org/details/books/chemistry-2e'],['U.S. History','OpenStax','History','OpenStax','https://openstax.org/details/books/us-history'],['How to Think Like a Computer Scientist','Runestone','Computer Science','Runestone Academy','https://runestone.academy/ns/books/published/thinkcspy/index.html']];
const BANK={Mathematics:{L:['Number systems','Algebra basics','Linear equations','Geometry intro'],Q:[['If 2x + 6 = 14, what is x?',['3','4','5'],1],['Angles of a triangle add up to?',['90°','180°','360°'],1],['Square root of 144?',['10','12','14'],1]]},English:{L:['Parts of speech','Tenses','Comprehension','Essay writing'],Q:[['Which is a noun?',['Quickly','Teacher','Run'],1],['Past tense of “go”?',['Goed','Went','Gone'],1]]},'General Science':{L:['Living things','Matter and energy','Force and motion','Our planet'],Q:[['Plants make food by?',['Photosynthesis','Digestion','Evaporation'],0],['Water boils at (°C)?',['50','100','150'],1]]},'Computer Science':{L:['What is a computer','Input and output','Files and folders','Intro to coding'],Q:[['Which is an input device?',['Monitor','Keyboard','Speaker'],1],['CPU stands for?',['Central Processing Unit','Computer Power Unit','Core Print Unit'],0]]},'English IELTS':{L:['IELTS format','Listening tips','Reading skimming','Writing Task 1','Speaking Part 2'],Q:[['IELTS has how many sections?',['2','4','6'],1]]},CSS:{L:['Exam scheme','Essay','Precis and composition','Current affairs'],Q:[['CSS is held by?',['FPSC','PPSC','HEC'],0]]}};
const S={user:null,role:'',lr:'student',step:'cred',next:null,otp:null,fails:{},lock:{},full:[],att:{},msgs:[],FT:{'Matric · Class 3–10':[15000,30000],'FSc / ICS / ICom · Class 11–12':[20000,30000],'O Level / A Level':[35000,45000]},RATE:{PKR:1,USD:280,GBP:355,EUR:305},cur:'PKR',mode:0,ftype:'Online',ref:'',refUsed:false,force:false,over:0,paid:false,rc:0,tp:{fee:100000,yrs:1,bonus:5000,late:2},screen:'login',lastAct:Date.now(),portal:'Pakistani',cls:'Class 3',board:'Punjab Board',medium:'English Medium',system:'Government',religion:'Muslim',opt:['Computer Science','General Science'],stream:'FSc',manualSub:false,courses:['English IELTS'],marketing:true,sound:true,lang:'English',flip:2,last:'',course:null,tab:'Lectures',quiz:{},q:'',pay:'Bank transfer',adm:[],f:{},files:{},
 stu:{name:'Ayesha (demo student)',done:{},scores:{},dl:[],saved:[]},
 ST:[['Ali Raza','Class 9','Active'],['Sara Malik','O Level','Active'],['Hamza Khan','Class 5','Blocked']],
 PAY:[],ANN:['Welcome to the new session. Classes begin Monday.'],BK:BOOKS.slice(),post:'',reqs:[]};

let audioCtx=null;
function isSilentScreen(sc){return sc==='form'||sc==='lms'||sc==='course'}
function playTone(freqs,durSec,vol){
  if(!S.sound||isSilentScreen(S.screen))return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;
    freqs.forEach((f,idx)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='triangle';
      osc.frequency.setValueAtTime(f,now+idx*0.18);
      gain.gain.setValueAtTime(0.0001,now+idx*0.18);
      gain.gain.exponentialRampToValueAtTime(vol,now+idx*0.18+0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+durSec);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(now+idx*0.18);osc.stop(now+durSec+0.02);
    });
  }catch(_){}
}
function triggerPageAudio(sc){
  if(!S.sound||isSilentScreen(sc))return;
  if(sc==='login'||sc==='home')playTone([261.63,329.63,392.0,523.25],2.2,0.035);
  else playTone([392.0,493.88],Math.min(3,Math.max(2,S.flip||2)),0.02);
}
function toggleSound(){S.sound=!S.sound;if(S.sound)triggerPageAudio(S.screen);render()}

const compulsory=()=>['English','Urdu','Mathematics',S.religion==='Muslim'?'Islamiat':'Ethics'];
const myCourses=()=>[...compulsory(),...S.opt,...S.courses];
const lessons=c=>(BANK[c]||{L:['Introduction','Core concepts','Practice','Revision']}).L;
const key=(c,i)=>c+'|'+i;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
const HOME={student:'home',parent:'p_home',teacher:'t_home',accountant:'a_fees',director:'a_home'};
const SCR={student:['home','lms','course','library','fees','receipt'],parent:['p_home','fees','receipt'],teacher:['t_home','t_pay'],accountant:['a_fees','a_students','a_adm','receipt'],director:['a_home','a_students','a_fees','a_lib','a_mkt','a_adm','receipt']};
const PUB=['login','about','portal','subjects','courses','summary','form','done','status','jobs','help'];
const DEMO={director:['director','Director@123'],accountant:['accountant','Account@123'],teacher:['teacher','Teacher@123'],student:['student','Student@123'],parent:['parent','Parent@123']};
function gate(s){if(PUB.includes(s))return s;if(!S.user){S.next=s;return 'login'}if(S.role==='student'&&S.over>3&&!S.paid&&['lms','course','library'].includes(s)){toast('Portal locked: fee overdue. Pay to unlock.');return 'fees'}if((SCR[S.role]||[]).includes(s))return s;toast('Your role cannot open this page');return HOME[S.role]}
function go(s,x){S.screen=gate(s);if(x!==undefined)S.course=x;render();scrollTo(0,0)}
function pickRole(v){S.lr=String(v).toLowerCase();render()}
function enter(r){S.user=r;S.role=r;S.step='cred';S.otp=null;S.lastAct=Date.now();const d=S.next;S.next=null;go(d||HOME[r])}
function demoIn(r){enter(r)}
function doLogin(){const k=S.lr,u=$('#lu').value.trim(),p=$('#lp').value;if(S.full.includes(k))return toast('Account fully locked. Only the Director can unlock it.');if(S.lock[k]&&Date.now()<S.lock[k])return toast('Locked for 30 minutes after 3 wrong tries.');if(u===DEMO[k][0]&&p===DEMO[k][1]){S.fails[k]=0;S.otp={c:String(Math.floor(100000+Math.random()*900000)),t:Date.now()};S.step='otp';return render()}const f=(S.fails[k]||0)+1;S.fails[k]=f;if(f>=5){S.full.push(k);toast('Fully locked. Only the Director can unlock it.')}else if(f>=3){S.lock[k]=Date.now()+30*60000;toast('3 wrong tries. Locked for 30 minutes. Admin informed (demo).')}else toast('Wrong username or password ('+f+'/3)')}
function doOtp(){const v=$('#lo').value.trim();if(Date.now()-S.otp.t>120000){S.step='cred';render();return toast('Code expired. Log in again.')}if(v!==S.otp.c)return toast('Wrong code');enter(S.lr)}
function logout(){S.user=null;S.role='';S.screen='login';render()}
function unlock(k){S.full=S.full.filter(x=>x!==k);S.fails[k]=0;delete S.lock[k];render()}
const NAMES=()=>[S.stu.name,...S.ST.filter(r=>r[2]==='Active').map(r=>r[0])];
function mark(i,v){S.att[NAMES()[i]]=v;render()}
function sendAtt(){const ab=NAMES().filter(n=>S.att[n]==='A');ab.forEach(n=>S.msgs.push('Your child '+n.split(' ')[0]+' was absent today. Is everything OK?'));toast(ab.length?ab.length+' parent message(s) sent':'Attendance saved')}
function calcPay(){document.querySelectorAll('[data-t]').forEach(e=>S.tp[e.dataset.t]=Math.max(0,+e.value||0));render()}
setInterval(()=>{if(S.user&&Date.now()-S.lastAct>600000){logout();toast('Logged out after 10 minutes without activity')}},15000);
addEventListener('click',()=>{S.lastAct=Date.now()});addEventListener('keydown',()=>{S.lastAct=Date.now()});

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(list,sel,fn){return `<div class="chips">${list.map(x=>`<button class="chip ${(Array.isArray(sel)?sel.includes(x):sel===x)?'on':''}" onclick="${fn}(this.dataset.v)" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}
function sel(label,k,opts){return `<label>${esc(label)}</label><select onchange="S['${k}']=this.value;render()">${opts.map(o=>`<option ${S[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function head(t,back){return `<div class="top">${back?`<button class="back" aria-label="Back" onclick="go('${back}')">←</button>`:''}<span class="sp"></span><button class="back" onclick="go('help')">?</button></div><h2>${esc(t)}</h2>`}
function tog(k){return `<button class="tg ${S[k]?'on':''}" aria-label="toggle" onclick="S['${k}']=!S['${k}'];render()"></button>`}
function pct(c){const L=lessons(c);return Math.round(L.filter((_,i)=>S.stu.done[key(c,i)]).length/L.length*100)}
function pickOpt(x){const i=S.opt.indexOf(x);if(i>=0)S.opt.splice(i,1);else if(S.opt.length<3)S.opt.push(x);else toast('Maximum 3 optional subjects');render()}
function pickCourse(x){const i=S.courses.indexOf(x);i>=0?S.courses.splice(i,1):S.courses.push(x);render()}
function pickStream(x){S.stream=x;render()}
function toggleManualSub(){S.manualSub=!S.manualSub;toast(S.manualSub?'Manual subject edit unlocked':'Automatic stream lock active');render()}
function chk(){const v=$('#an').value.trim();const a=S.adm.find(x=>String(x.no)===v);$('#sr').innerHTML=!v?'<div class="card bad">Enter your admission number.</div>':!a?'<div class="card bad">No admission found with this number.</div>':a.st==='Active'?'<div class="card"><b class="ok">● Active</b><div class="mut">Login and password instructions go to your email. You can change the password after first login.</div></div>':a.st==='Inactive'?'<div class="card"><b class="bad">● Inactive</b><div class="mut">Reason: '+esc(a.reason)+'. Please contact the Director’s desk.</div></div>':'<div class="card"><b>● Pending</b><div class="mut">The Director is reviewing your form and documents.</div></div>'}

const CFG={url:'',token:''};
function push(kind,d){if(!CFG.url)return;try{fetch(CFG.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.token,kind,data:d})}).catch(()=>{})}catch(e){}}
function backupNow(){if(!CFG.url)return toast('Backup link is not set yet. It works once the app is on your GitHub page.');S.adm.forEach(a=>push('admission',a));S.PAY.forEach(p=>push('payment',p));S.ST.forEach(r=>push('student',{name:r[0],cls:r[1],st:r[2]}));toast('Backup sent to the Google Sheet')}
const band=()=>S.cls==='O Level'||S.cls==='A Level'?'O Level / A Level':['Class 11','Class 12'].includes(S.cls)?'FSc / ICS / ICom · Class 11–12':'Matric · Class 3–10';
function muharram(){try{const m=new Intl.DateTimeFormat('en-u-ca-islamic',{month:'numeric'}).formatToParts(new Date()).find(p=>p.type==='month').value;return +m===1}catch(e){return false}}
function quote(){const base=S.FT[band()][S.mode];const refOk=S.adm.some(a=>'ADM-'+a.no===S.ref)&&!S.refUsed;const muh=muharram()||S.force;const d=Math.max(muh?30:0,refOk?10:0);return {base,d,refOk,net:base*(1-d/100),label:d===30?'Muharram offer 30% off':d===10?'Referral 10% off (first month)':'No discount'}}
function fmt(pkr,cur){cur=cur||S.cur;return (cur==='PKR'?'Rs ':{USD:'$',GBP:'£',EUR:'€'}[cur])+Math.round(pkr/S.RATE[cur]).toLocaleString('en-US')}
function pickMode(v){S.mode=v.startsWith('One')?1:0;render()}
function pickType(v){S.ftype=v;render()}
function pickCur(v){S.cur=v;render()}
function saveFees(){document.querySelectorAll('[data-fb]').forEach(e=>{S.FT[e.dataset.fb][+e.dataset.fm]=+e.value||0});document.querySelectorAll('[data-rc]').forEach(e=>{S.RATE[e.dataset.rc]=+e.value||1});toast('Fees saved');render()}
function sendRem(){const n=S.stu.name.split(' ')[0];S.msgs.push('Fee reminder: '+n+'’s fee is due in 3 days.','Fee reminder: '+n+'’s fee is due today.','Fee reminder: '+n+'’s fee is overdue.');toast('3 reminders saved as portal notifications')}
function showRc(i){S.rc=i;go('receipt')}
function saveF(){document.querySelectorAll('[data-f]').forEach(e=>S.f[e.dataset.f]=e.type==='checkbox'?e.checked:e.value)}
function fileSel(k,inp){saveF();const f=inp.files[0];if(!f)return;if(f.size>2*1024*1024){inp.value='';return toast('File is over 2 MB. Choose a smaller one.')}S.files[k]={n:f.name,s:Math.round(f.size/1024)};if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{S.files[k].u=r.result;render()};r.readAsDataURL(f)}else render()}
function submitAdm(){saveF();if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/.test(S.f.password||''))return toast('Password needs 8+ characters with a capital, a small letter, a number and a symbol');if(!S.f.cons)return toast('Parent consent is required');if(!S.f.name||!S.f.father||!S.f.phone)return toast('Fill name, guardian and phone');if(!S.files.photo||!S.files.bform)return toast('Attach the photo and the B-Form / CNIC');const no=1001+S.adm.length;S.adm.push({no,name:S.f.name,cls:S.cls,n:Object.keys(S.files).length,st:'Pending',reason:''});S.lastNo=no;push('admission',{no,name:S.f.name,father:S.f.father,phone:S.f.phone,cls:S.cls,board:S.board});delete S.f.password;go('done')}
function decide(i,s){const a=S.adm[i];a.st=s;if(s==='Inactive')a.reason=document.getElementById('rs'+i).value;else S.ST.push([a.name,a.cls,'Active']);render()}
function done(c,i){const k=key(c,i);S.stu.done[k]=!S.stu.done[k];render()}
function ans(c,qi,oi){S.quiz[c+qi]=oi;const Q=BANK[c].Q;if(Q.every((_,n)=>S.quiz[c+n]!==undefined))S.stu.scores[c]=Q.filter((q,n)=>S.quiz[c+n]===q[2]).length+'/'+Q.length;render()}
function retry(c){BANK[c].Q.forEach((_,n)=>delete S.quiz[c+n]);delete S.stu.scores[c];render()}
function getBook(i,dl){const b=S.BK[i];if(dl&&!S.stu.dl.includes(b[0]))S.stu.dl.push(b[0]);window.open(b[4],'_blank','noopener');render()}
function saveBook(i){const t=S.BK[i][0];const k=S.stu.saved.indexOf(t);k>=0?S.stu.saved.splice(k,1):S.stu.saved.push(t);render()}
function payNow(){const q=quote();const p={n:'R-'+(1000+S.PAY.length+1),a:q.net,base:q.base,d:q.d,disp:fmt(q.net),m:S.pay,st:'Pending',date:new Date().toLocaleDateString('en-GB'),who:S.stu.name,cls:S.cls,mode:['Group','One-to-one'][S.mode],ft:S.ftype};S.PAY.push(p);if(q.refOk)S.refUsed=true;S.msgs.push('Thank you. Fee '+p.disp+' for '+S.stu.name.split(' ')[0]+' has been received. Receipt '+p.n+' follows after approval.');push('payment',p);toast('Thank you. Sent for approval');render()}
function approve(i){const p=S.PAY[i];p.st='Approved';S.paid=true;S.msgs.push('Receipt '+p.n+' has been issued for '+S.stu.name.split(' ')[0]+'. Portal is unlocked.');push('payment',p);render()}
function addBook(){const t=$('#bt').value.trim(),u=$('#bu').value.trim();if(!t||!/^https?:/.test(u))return toast('Enter a title and a full link');S.BK.push([t,'Added by Director','General','Link',u]);render()}
function rmBook(i){S.BK.splice(i,1);render()}
function addStu(){const n=$('#sn').value.trim();if(!n)return;S.ST.push([n,$('#sc').value,'Active']);render()}
function stuAct(i,a){const r=S.ST[i];if(a==='b')r[2]=r[2]==='Blocked'?'Active':'Blocked';else{const L=['Class 3','Class 5','Class 8','Class 9','Class 10','Class 11','Class 12'];const k=L.indexOf(r[1]);if(k>=0&&k<L.length-1)r[1]=L[k+1]}render()}
function postAnn(){const t=$('#an2').value.trim();if(t){S.ANN.unshift(t);toast('Published to all students')}render()}
function genPost(){if(!S.marketing)return toast('Marketing is OFF');const c=$('#pc').value,l=$('#pl').value;S.post=l==='Urdu'?`نیا کورس: ${c}۔ آج ہی داخلہ لیں! سر ہارون جاوید ہاشمی گلوبل اکیڈمی اینڈ کالج`:`New course: ${c}. Enroll today at Sir Haroon Javaid Hashmi Global Academy & College.`;render()}
function sendHelp(){const t=$('#hm').value.trim();if(!t)return toast('Write a message first');S.reqs.unshift([S.priority||'Normal',t]);toast('Sent to Director');render()}

<div class="grid g2" style="margin-top:10px">${[['👥','Students','a_students'],['💳','Fees','a_fees'],['📚','Library','a_lib'],['📝','Admissions','a_adm'],['📣','Marketing &amp; notices','a_mkt']].map(t=>`<button class="tile" onclick="go('${t[2]}')"><div class="ico">${t[0]}</div><b>${t[1]}</b></button>`).join('')}</div>
${S.full.length?`<h3>Locked accounts</h3>${S.full.map(k=>`<div class="card row"><b>${esc(k)}</b><button class="chip on" onclick="unlock('${esc(k)}')">Unlock</button></div>`).join('')}`:''}<h3>Help requests</h3>${S.reqs.length?S.reqs.map(r=>`<div class="card"><b>${esc(r[0])}</b><div>${esc(r[1])}</div></div>`).join(''):'<div class="card mut">None yet.</div>'}`,
a_students:()=>head('Students','a_home')+`<div class="card"><div class="row"><span>${esc(S.stu.name)}</span><span class="ok">Active</span></div><div class="mut">${esc(S.cls)} · ${myCourses().length} courses · ${Math.round(myCourses().reduce((a,c)=>a+pct(c),0)/myCourses().length)}% done</div></div>`+S.ST.map((r,i)=>`<div class="card"><div class="row"><b>${esc(r[0])}</b><span class="${r[2]==='Active'?'ok':'bad'}">${esc(r[2])}</span></div><div class="mut">${esc(r[1])}</div>${S.role==='director'?`<div class="grid g2" style="margin-top:8px"><button class="chip" onclick="stuAct(${i},'b')">${r[2]==='Blocked'?'Unblock':'Block'}</button><button class="chip" onclick="stuAct(${i},'p')">Promote</button></div>`:''}</div>`).join('')+`<h3>Add student</h3><input id="sn" placeholder="Name"><label>Class</label><select id="sc"><option>Class 3</option><option>Class 5</option><option>Class 9</option><option>Class 10</option></select><button class="btn" onclick="addStu()">Add</button>`,
a_fees:()=>head('Fees &amp; payments','a_home')+`<div class="card row"><b>Send fee reminders</b><button class="chip on" onclick="sendRem()">Send 3 Alerts</button></div>`+(S.PAY.length?S.PAY.map((p,i)=>`<div class="card row"><div><b>${esc(p.n)} · ${esc(p.disp)}</b><div class="mut">${esc(p.who)} · ${esc(p.m)}</div></div><div>${p.st==='Pending'?`<button class="chip on" onclick="approve(${i})">Approve</button>`:'<b class="ok">Approved</b>'} <button class="chip" onclick="showRc(${i})">Slip</button></div></div>`).join(''):'<div class="card mut">No payments yet.</div>')+`<h3>Fee table (PKR) &amp; FX rates</h3><div class="card">${Object.keys(S.FT).map(b=>`<div style="margin-bottom:8px"><b>${esc(b)}</b><div class="grid g2"><input data-fb="${esc(b)}" data-fm="0" type="number" value="${S.FT[b][0]}"><input data-fb="${esc(b)}" data-fm="1" type="number" value="${S.FT[b][1]}"></div></div>`).join('')}<div class="grid g3">${['USD','GBP','EUR'].map(c=>`<div><label>${c}</label><input data-rc="${c}" type="number" value="${S.RATE[c]}"></div>`).join('')}</div><button class="btn" onclick="saveFees()">Save fees &amp; rates</button></div>`,
a_lib:()=>head('Library control','a_home')+S.BK.map((b,i)=>`<div class="card row"><div><b>${esc(b[0])}</b><div class="mut">${esc(b[3])}</div></div><button class="chip" onclick="rmBook(${i})">Remove</button></div>`).join('')+`<h3>Add a book</h3><input id="bt" placeholder="Title"><label>Link to the book</label><input id="bu" placeholder="https://…"><button class="btn" onclick="addBook()">Add book</button>`,
a_mkt:()=>head('Marketing &amp; notices','a_home')+`<div class="card row"><b>Auto-marketing</b>${tog('marketing')}</div><label>Course</label><select id="pc">${['English IELTS','CSS','MDCAT','German','Mathematics'].map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>Language</label><select id="pl"><option>English</option><option>Urdu</option></select><button class="btn" onclick="genPost()">Generate post</button>${S.post?`<div class="card">${esc(S.post)}<button class="btn o" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.post);toast('Copied')">Copy to share</button></div>`:''}<h3>Announcement for students</h3><textarea id="an2" rows="3"></textarea><button class="btn" onclick="postAnn()">Publish announcement</button>`
};

function render(){
  const a=$('#app');
  const N={student:[['home','🏠','Home'],['lms','🎓','Study'],['library','📚','Library'],['fees','💳','Fees'],['help','❓','Help']],parent:[['p_home','👨‍👩‍👧','Child'],['fees','💳','Fees'],['help','❓','Help']],teacher:[['t_home','🧑‍🏫','Class'],['t_pay','💰','Pay'],['help','❓','Help']],accountant:[['a_fees','💳','Fees'],['a_students','👥','Students'],['a_adm','📝','Admissions'],['help','❓','Help']],director:[['a_home','🛡️','Control'],['a_students','👥','Students'],['a_fees','💳','Fees'],['a_lib','📚','Library'],['a_mkt','📣','Notices']]};
  const nav=N[S.role]||[];const grp={course:'lms',receipt:'fees'};const cur=grp[S.screen]||S.screen;
  a.innerHTML=`<div class="hd"><div class="logo">HJ</div><div class="nm">SIR HAROON JAVAID HASHMI ACADEMY</div><button class="snd ${S.sound?'':'off'}" onclick="toggleSound()" title="Toggle sound">${S.sound?'🔊 ON':'🔇 OFF'}</button>${S.user?`<button class="out" onclick="logout()">Log out</button>`:''}</div>`+V[S.screen]();
  if(S.screen!==S.last){a.style.animation='none';a.offsetWidth;a.style.animation='fl '+S.flip+'s ease-out';triggerPageAudio(S.screen);S.last=S.screen}
  const nv=$('#nav');nv.style.display=nav.length?'flex':'none';
  nv.innerHTML=nav.map(n=>`<button class="${n[0]===cur?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
}
const HR={'login':'login','about':'about','admission-form':'form','start':'portal','subjects':'subjects','courses':'courses','summary':'summary','status':'status','study':'lms','library':'library','fees':'fees','receipt':'receipt','help':'help','jobs':'jobs','director':'a_home','students':'a_students','payments':'a_fees','library-control':'a_lib','marketing':'a_mkt','admissions':'a_adm','teacher':'t_home','teacher-pay':'t_pay','parent':'p_home'};
function fromHash(){const h=location.hash.slice(1);if(HR[h])go(HR[h])}
addEventListener('hashchange',fromHash);render();fromHash();
</script></body></html>
